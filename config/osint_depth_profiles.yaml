# Meridian OSINT Assessment Depth Profiles — Unified Authoritative Configuration
# Single source of truth for OSINT depth selection, required/conditional/corroborative source classes,
# review governance, configurable POC timeboxes, and stopping conditions.
#
# UNIFIED SOURCE METHODOLOGY RESOLUTION:
# - Vendor-specific dynamic sources (S1 trust centers/DPAs/subprocessors, S3 terms/privacy/whitepapers,
#   S12 marketing/press releases), hybrid technical sources (S2 product docs/APIs/SDKs/public repos,
#   S4 engineering blogs/tech talks/open-source technical publications/model cards), and fixed-platform sources
#   (S5 filings/annual reports/certifications, S6 job postings/hiring signals, S7 executive/IR statements,
#   S8 marketplace/partner listings, S9 passive technical fingerprints, S10 patents/research papers,
#   S11 third-party reporting/news) are unified directly into the four depth profiles below.

profiles:
  Critical:
    name: "Critical"
    tier_label: "Critical"
    description: "Exhaustive OSINT investigation across all S1–S12 source classes with dual-reviewer sign-off."
    required_sources:
      - "S1"
      - "S2"
      - "S3"
      - "S4"
      - "S5"
      - "S6"
      - "S7"
      - "S8"
      - "S9"
      - "S10"
      - "S11"
      - "S12"
    conditional_sources: []
    corroborative_sources:
      - "S9"
      - "S10"
      - "S11"
    source_coverage_notes:
      - "Required: Full S1–S12 coverage across all canonical vendor-specific, hybrid, and fixed-platform source classes"
      - "S1–S4: Trust centers/DPAs, product docs/SDKs/public repos, terms/privacy/whitepapers, and engineering blogs/talks/model cards"
      - "S5–S8: Filings/certifications, technical job postings, executive/IR statements, and marketplace/partner listings"
      - "S9–S12: Passive technical fingerprints, patents/papers, third-party reporting/news, and marketing/press material"
    review_requirements:
      analyst_validation: true
      second_reviewer: true
      description: "Primary analyst validation plus independent second reviewer sign-off."
    timebox:
      planning_target: "30 minutes"
      planned_minutes: 30
      min_hours: 0.5
      max_hours: 0.5
      is_provisional: true
    stopping_condition:
      rule_id: "STOP_CRITICAL_GATES"
      description: "Stop when G1–G4 gates have been answered with qualifying evidence or relevant negative findings have been logged."
      requirements:
        - "All four G1–G4 gates must be resolved with qualifying positive evidence OR qualifying negative evidence logged."
        - "Unresolved gates prevent completion; active analyst effort reaching the timebox marks the assessment TIMEBOX_EXHAUSTED_INCOMPLETE."

  High:
    name: "High"
    tier_label: "High"
    description: "Thorough multi-source investigation covering primary contractual/technical disclosures, SDKs/public repos, filings, hiring, executive/IR, and marketplaces, with conditional engineering blog, passive fingerprint, and third-party reporting checks."
    required_sources:
      - "S1"
      - "S2"
      - "S3"
      - "S5"
      - "S6"
      - "S7"
      - "S8"
    conditional_sources:
      - source_id: "S4"
        condition: "Required where engineering blogs, technical talks, open-source technical publications, or model cards exist"
      - source_id: "S9"
        condition: "Required where passive technical fingerprints (package dependency manifests, container images, client bundles, or code-search indicators) are needed to resolve G1/G4"
      - source_id: "S11"
        condition: "Used where third-party reporting, industry news, or external community discussions are needed to corroborate or challenge vendor claims"
    corroborative_sources:
      - "S10"
      - "S12"
    source_coverage_notes:
      - "Required: S1 (trust/DPAs), S2 (product docs/APIs/SDKs/public repos), S3 (terms/privacy/whitepapers), S5 (filings/certifications), S6 (job postings), S7 (executive/IR), S8 (marketplaces/partners)"
      - "Conditional: S4 (engineering blogs/talks/model cards), S9 (passive technical fingerprints), S11 (third-party reporting/news)"
      - "Corroborative: S10 (patents/papers), S12 (marketing/press releases for feature-name discovery)"
    review_requirements:
      analyst_validation: true
      second_reviewer: false
      description: "Primary analyst validation required."
    timebox:
      planning_target: "20 minutes"
      planned_minutes: 20
      min_hours: 0.33
      max_hours: 0.33
      is_provisional: true
    stopping_condition:
      rule_id: "STOP_HIGH_NOVELTY"
      description: "Stop after two consecutive completed source classes add no new information (evidence-level novelty) or all required sources are completed."
      requirements:
        - "Track evidence-level novelty (new AI provider, new product feature, new training disclosure, or resolved gate)."
        - "Two consecutive non-novel completed source classes or full required source completion triggers stopping condition."

  Medium:
    name: "Medium"
    tier_label: "Medium"
    description: "Targeted investigation covering vendor trust/DPA disclosures, product docs/SDKs/public repos, privacy/terms, and technical job postings, with conditional engineering publication and passive fingerprint checks."
    required_sources:
      - "S1"
      - "S2"
      - "S3"
      - "S6"
    conditional_sources:
      - source_id: "S4"
        condition: "Checked if vendor publishes engineering blogs, technical talks, open-source technical publications, or model cards, or if G1–G2 remain unresolved after S2"
      - source_id: "S9"
        condition: "Checked if passive technical fingerprints (package dependency manifests, container images, or code-search indicators) are needed to verify technical stack"
    corroborative_sources:
      - "S12"
    source_coverage_notes:
      - "Required: S1 (trust/DPAs/subprocessors), S2 (product docs/APIs/SDKs/public repos), S3 (terms/privacy/whitepapers), S6 (technical job postings)"
      - "Conditional: S4 (engineering blogs/talks/model cards) and S9 (passive technical fingerprints) when deeper technical verification is required"
      - "Corroborative: S12 keyword scan for marketing/press AI claims"
    review_requirements:
      analyst_validation: false
      analyst_spot_check: true
      second_reviewer: false
      description: "Analyst spot-check of key findings."
    timebox:
      planning_target: "10 minutes"
      planned_minutes: 10
      min_hours: 0.17
      max_hours: 0.17
      is_provisional: true
    stopping_condition:
      rule_id: "STOP_MEDIUM_CONFIRMED"
      description: "Stop after obtaining one CONFIRMED qualifying signal or exhausting the required source classes."
      requirements:
        - "One confirmed qualifying AI signal triggers stop condition."
        - "Otherwise, stop upon completing all required Medium source classes (S1, S2, S3, S6)."
        - "Outstanding gates are logged as unresolved."

  Low:
    name: "Low"
    tier_label: "Low"
    description: "Lightweight baseline pass across vendor trust/subprocessor disclosures, privacy/terms, and marketing claims."
    required_sources:
      - "S1"
      - "S3"
      - "S12"
    conditional_sources:
      - source_id: "S2"
        condition: "Checked only if S12 marketing pages claim AI features requiring scope verification in product docs, SDKs, or public repos"
    corroborative_sources: []
    source_coverage_notes:
      - "Required: S1 (trust/subprocessors/DPAs), S3 (terms/privacy/whitepapers), S12 (marketing pages/press releases)"
      - "Conditional: S2 (product docs/APIs/SDKs/public repos) only if S12 surfaces an AI claim"
      - "Reassess annually or upon relevant contract/service trigger"
    review_requirements:
      analyst_validation: false
      second_reviewer: false
      description: "Lightweight pass; exception-based analyst review only."
    timebox:
      planning_target: "5 minutes"
      planned_minutes: 5
      min_hours: 0.08
      max_hours: 0.08
      is_provisional: true
    stopping_condition:
      rule_id: "STOP_LOW_PASS"
      description: "Complete the configured lightweight source pass (S1, S3, S12)."
      requirements:
        - "Complete baseline checks on S1, S3, S12."
        - "Log annual/trigger reassessment schedule."
