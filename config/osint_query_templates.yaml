# Meridian OSINT Query Templates Library
# Placeholders: {VENDOR}, {DOMAIN}, {PRODUCT}, {PROVIDER}, {DATE_RANGE}

templates:
  # General vendor queries
  q_general_ai:
    id: "q_general_ai"
    category: "General vendor queries"
    template: '"{VENDOR}" AI'
    source_class: "S12"
    discovery_resource: "google_search"
    investigative_objective: "Detect high-level artificial intelligence mentions and marketing claims."
    expected_evidence_targets: ["High-level AI claims", "Product marketing feature names"]

  q_general_ml:
    id: "q_general_ml"
    category: "General vendor queries"
    template: '"{VENDOR}" "machine learning"'
    source_class: "S12"
    discovery_resource: "google_search"
    investigative_objective: "Identify machine learning applications and data science initiatives."
    expected_evidence_targets: ["Machine learning product features", "Data science initiatives"]

  q_general_llm:
