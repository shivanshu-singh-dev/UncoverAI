# Discovery Resource Inventory & Catalog
# Maps external research tools to official S1-S12 source classes

resources:
  # Search and discovery
  google_search:
    id: "google_search"
    name: "Google Search Operators"
    category: "Search and discovery"
    associated_sources: ["S1", "S2", "S3", "S4", "S8", "S11", "S12"]
    purpose: "Targeted dorking for trust centers, subprocessor pages, terms, engineering blogs, and technical documentation."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Rate limits and CAPTCHA enforcement on automated scrapers."

  google_advanced_search:
    id: "google_advanced_search"
    name: "Google Advanced Search"
    category: "Search and discovery"
    associated_sources: ["S1", "S3", "S5"]
    purpose: "Filetype and date-constrained document discovery (DPAs, PDFs, formal policies, annual reports)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Manual analyst interface; query length limits."

  bing_search:
    id: "bing_search"
    name: "Bing Web Search API / Search"
    category: "Search and discovery"
    associated_sources: ["S1", "S2", "S11", "S12"]
    purpose: "Secondary search provider for corroborating indexed technical assets, news, and marketing pages."
    access_mode: "API_BASED"
    limitations: "Requires cognitive services API key quota."

  duckduckgo:
    id: "duckduckgo"
    name: "DuckDuckGo"
    category: "Search and discovery"
    associated_sources: ["S11", "S12"]
    purpose: "Unbiased, non-personalized search indexing for third-party reporting, marketing pages, and press releases."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Less comprehensive operator syntax compared to Google."

  osint_framework:
    id: "osint_framework"
    name: "OSINT Framework"
    category: "Search and discovery"
    associated_sources: ["S9"]
    purpose: "Taxonomy of passive entity and technical fingerprint discovery tools."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Directory of tools rather than automated data source."

  bellingcat_toolkit:
    id: "bellingcat_toolkit"
    name: "Bellingcat Online Investigation Toolkit"
    category: "Search and discovery"
    associated_sources: ["S9", "S11"]
    purpose: "Methodological toolkit for passive technical verification and third-party open-source corroboration."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Manual investigative procedures."

  # Code and technical evidence
  github:
    id: "github"
    name: "GitHub"
    category: "Code and technical evidence"
    associated_sources: ["S2", "S4", "S9"]
    purpose: "Public vendor repositories and SDKs (S2), open-source technical publications and model cards (S4), and passive dependency/manifest fingerprints (S9)."
    access_mode: "API_BASED"
    limitations: "Public repositories only; rate limits on unauthenticated API calls."

  gitlab:
    id: "gitlab"
    name: "GitLab"
    category: "Code and technical evidence"
    associated_sources: ["S2", "S4", "S9"]
    purpose: "Public vendor repositories and SDKs (S2), open-source technical publications (S4), and passive manifest fingerprints (S9)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Requires authenticated tokens for deep code indexing."

  github_code_search:
    id: "github_code_search"
    name: "GitHub Code Search"
    category: "Code and technical evidence"
    associated_sources: ["S2", "S9"]
    purpose: "Regex and symbol searches across public repositories/SDKs (S2) and passive technical fingerprinting for AI SDK imports (S9)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Requires GitHub user login for deep regex code search."

  npm:
    id: "npm"
    name: "npm Registry"
    category: "Code and technical evidence"
    associated_sources: ["S2", "S9"]
    purpose: "Published JavaScript/TypeScript vendor SDKs (S2) and passive package.json dependency fingerprinting (S9)."
    access_mode: "AUTOMATED"
    limitations: "Only covers public client/node packages; internal logic usually minified."

  pypi:
    id: "pypi"
    name: "PyPI"
    category: "Code and technical evidence"
    associated_sources: ["S2", "S9"]
    purpose: "Published Python vendor SDKs/connectors (S2) and passive package dependency fingerprinting (S9)."
    access_mode: "AUTOMATED"
    limitations: "Only covers public distributions."

  maven_central:
    id: "maven_central"
    name: "Maven Central"
    category: "Code and technical evidence"
    associated_sources: ["S2", "S9"]
    purpose: "Published Java/JVM vendor SDKs (S2) and passive POM dependency fingerprinting (S9)."
    access_mode: "AUTOMATED"
    limitations: "Covers public releases only."

  docker_hub:
    id: "docker_hub"
    name: "Docker Hub"
    category: "Code and technical evidence"
    associated_sources: ["S9"]
    purpose: "Container image manifests and layer metadata indicating AI inference frameworks or CUDA runtimes (S9)."
    access_mode: "AUTOMATED"
    limitations: "Many enterprise vendors publish to private registries."

  hugging_face:
    id: "hugging_face"
    name: "Hugging Face"
    category: "Code and technical evidence"
    associated_sources: ["S4", "S9"]
    purpose: "Published model cards and open-source technical publications (S4), plus passive technical footprint of hosted checkpoints/datasets (S9)."
    access_mode: "AUTOMATED"
    limitations: "Vendor organization must be officially registered and public."

  # People, hiring and discussion
  linkedin:
    id: "linkedin"
    name: "LinkedIn"
    category: "People, hiring and discussion"
    associated_sources: ["S6", "S7"]
    purpose: "Engineering team hiring signals/skill profiles (S6) and executive leadership statements (S7)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Strict anti-scraping controls and login walls."

  linkedin_jobs:
    id: "linkedin_jobs"
    name: "LinkedIn Jobs"
    category: "People, hiring and discussion"
    associated_sources: ["S6"]
    purpose: "Technical job postings for Machine Learning Engineers, LLM Specialists, and MLOps (S6)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Postings expire quickly; anti-bot protections."

  indeed:
    id: "indeed"
    name: "Indeed"
    category: "People, hiring and discussion"
    associated_sources: ["S6"]
    purpose: "Job requisitions specifying production AI/ML framework experience (S6)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Commercial scraping restrictions."

  greenhouse:
    id: "greenhouse"
    name: "Greenhouse"
    category: "People, hiring and discussion"
    associated_sources: ["S6"]
    purpose: "Direct vendor applicant tracking job descriptions with engineering stack details (S6)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Vendor-specific board URLs."

  lever:
    id: "lever"
    name: "Lever"
    category: "People, hiring and discussion"
    associated_sources: ["S6"]
    purpose: "Direct vendor ATS listings detailing technical responsibilities and AI tooling (S6)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Vendor-specific board URLs."

  reddit:
    id: "reddit"
    name: "Reddit"
    category: "People, hiring and discussion"
    associated_sources: ["S11"]
    purpose: "Third-party practitioner discussions, customer reports, and external community commentary (S11)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Unverified anonymous commentary (Evidence Grade C)."

  stack_overflow:
    id: "stack_overflow"
    name: "Stack Overflow"
    category: "People, hiring and discussion"
    associated_sources: ["S11"]
    purpose: "Third-party developer troubleshooting discussions mentioning vendor APIs and AI integrations (S11)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Fragmented community questions."

  youtube:
    id: "youtube"
    name: "YouTube"
    category: "People, hiring and discussion"
    associated_sources: ["S4", "S7"]
    purpose: "Engineering conference talks and technical architecture presentations (S4), plus executive keynotes and investor briefings (S7)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Requires transcription or manual listening."

  # News, filings and research
  google_news:
    id: "google_news"
    name: "Google News"
    category: "News, filings and research"
    associated_sources: ["S5", "S7", "S11"]
    purpose: "Formal disclosure coverage (S5), executive/investor statements (S7), and independent third-party reporting and news (S11)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Heavy PR syndication requires deduplication."

  sec_edgar:
    id: "sec_edgar"
    name: "SEC EDGAR"
    category: "News, filings and research"
    associated_sources: ["S5"]
    purpose: "Mandatory corporate filings and annual reports (10-K, 10-Q, 8-K) regarding AI strategies and risks (S5)."
    access_mode: "API_BASED"
    limitations: "Only covers US publicly traded firms."

  companies_house:
    id: "companies_house"
    name: "UK Companies House"
    category: "News, filings and research"
    associated_sources: ["S5"]
    purpose: "Official corporate filings and strategic annual reports for UK entities (S5)."
    access_mode: "API_BASED"
    limitations: "UK registered entities only."

  mca_india:
    id: "mca_india"
    name: "India MCA Company Search"
    category: "News, filings and research"
    associated_sources: ["S5"]
    purpose: "Corporate statutory filings and formal disclosures for Indian entities (S5)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Requires portal access."

  google_patents:
    id: "google_patents"
    name: "Google Patents"
    category: "News, filings and research"
    associated_sources: ["S10"]
    purpose: "Patent applications and granted IP for machine learning techniques (S10)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Patents indicate capability, not production deployment."

  google_scholar:
    id: "google_scholar"
    name: "Google Scholar"
    category: "News, filings and research"
    associated_sources: ["S10"]
    purpose: "Peer-reviewed research papers by vendor scientists (S10)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Academic research may not reflect commercial product offerings."

  arxiv:
    id: "arxiv"
    name: "arXiv"
    category: "News, filings and research"
    associated_sources: ["S10"]
    purpose: "Pre-print machine learning research papers authored by vendor staff (S10)."
    access_mode: "AUTOMATED"
    limitations: "Pre-prints are not peer-reviewed."

  crunchbase:
    id: "crunchbase"
    name: "Crunchbase"
    category: "News, filings and research"
    associated_sources: ["S7", "S8"]
    purpose: "Investor relations, funding announcements, and leadership changes (S7), plus partner/marketplace ecosystem listings (S8)."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Paywalled for advanced query filters."

  # Archiving and evidence preservation
  wayback_machine:
    id: "wayback_machine"
    name: "Wayback Machine"
    category: "Archiving and evidence preservation"
    associated_sources: ["S1", "S3", "S12"]
    purpose: "Historical page versions to detect policy changes, added AI terms, or deleted marketing claims."
    access_mode: "API_BASED"
    limitations: "Snapshots may be incomplete or intermittent."

  archive_today:
    id: "archive_today"
    name: "archive.today"
    category: "Archiving and evidence preservation"
    associated_sources: ["S1", "S3", "S11"]
    purpose: "Secondary on-demand web snapshot service for policies and third-party reporting."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Requires manual submission."

  perma_cc:
    id: "perma_cc"
    name: "Perma.cc"
    category: "Archiving and evidence preservation"
    associated_sources: ["S1", "S3"]
    purpose: "Cryptographically verified, immutable evidentiary link archiving."
    access_mode: "UNIMPLEMENTED"
    limitations: "Subscription account required."

  hunchly:
    id: "hunchly"
    name: "Hunchly"
    category: "Archiving and evidence preservation"
    associated_sources: ["S1", "S2", "S3"]
    purpose: "Analyst browser extension for automatic evidentiary case logging."
    access_mode: "UNIMPLEMENTED"
    limitations: "Desktop client application."

  singlefile:
    id: "singlefile"
    name: "SingleFile"
    category: "Archiving and evidence preservation"
    associated_sources: ["S1", "S2", "S3", "S6"]
    purpose: "Full-page standalone HTML/CSS snapshot utility for audit files."
    access_mode: "MANUALLY_ASSISTED"
    limitations: "Analyst-triggered local capture."
