# Official S1-S12 Source Registry Configuration
# Meridian Financial Third-Party AI Risk Assessment
# Unified authoritative source taxonomy incorporating vendor-specific dynamic discovery and fixed-platform sources.

sources:
  S1:
    source_id: "S1"
    name: "Trust centers, subprocessor registers, DPAs, and AI policies"
    description: "Trust centers, subprocessor registers, DPAs, and AI policies."
    default_evidence_grade: "A"
    reliability_rating: 5
    is_corroborative: false
    source_nature: "VENDOR_SPECIFIC"
    discovery_mode: "Dynamic vendor-specific domain and subprocessor/trust portal discovery"
    evidence_targets:
      - "Named AI and model providers"
      - "Customer data usage rights and restrictions"
      - "Retention and deletion policies for prompts/embeddings"
      - "Third-party and subprocessor processing disclosures"
      - "Hosting regions and data transfer safeguards"
    discovery_resources:
      - "google_search"
      - "google_advanced_search"
      - "bing_search"
      - "wayback_machine"
      - "archive_today"
      - "perma_cc"
      - "hunchly"
      - "singlefile"
    query_template_ids:
      - "q_subprocessors"
      - "q_dpa"
      - "q_not_used_to_train"
      - "q_site_subprocessors"
      - "q_site_privacy_ai"
      - "q_site_training_data"

  S2:
    source_id: "S2"
    name: "Product documentation, API references, admin guides, release notes, SDKs, and public repositories"
