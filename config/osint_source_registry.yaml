    reliability_rating: 5
    is_corroborative: false
    source_nature: "HYBRID"
    discovery_mode: "Dynamic vendor documentation and API portals combined with public SDK and repository platforms (GitHub, GitLab, npm, PyPI, Maven Central)"
    evidence_targets:
      - "Direct AI feature specifications and release notes"
      - "Underlying model family and API endpoint references"
      - "Input payload formats and generated output types"
      - "Admin opt-in/opt-out configuration toggles"
      - "Published vendor SDKs and public source repositories"
    discovery_resources:
      - "google_search"
      - "bing_search"
      - "github"
      - "gitlab"
      - "github_code_search"
      - "npm"
      - "pypi"
      - "maven_central"
      - "hunchly"
      - "singlefile"
    query_template_ids:
