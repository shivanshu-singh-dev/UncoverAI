[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-vendor-assessment"
version = "0.1.0"
description = "Meridian Financial - Third-Party Vendor Risk Assessment Pipeline (Phase 1 Foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
